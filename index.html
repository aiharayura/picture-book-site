<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>絵本を探す | Picture Book Guide</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <header class="site-header">
      <a class="brand" href="#">PICTURE BOOK GUIDE</a>
      <nav>
        <a href="#books">Books</a>
        <a href="#about">About</a>
      </nav>
    </header>

    <main>
      <section class="hero">
        <p class="eyebrow">PICTURE BOOK DATABASE</p>
        <h1>絵本を探す</h1>
        <p class="hero-text">
          タイトル、作者、年齢、テーマなどから絵本を探せる、小さな絵本データベースです。
        </p>
      </section>

      <section class="search-panel" aria-label="絵本検索">
        <label for="search-input">タイトル・作者から検索</label>
        <input
          id="search-input"
          type="search"
          placeholder="例：ぐりとぐら / せなけいこ"
          autocomplete="off"
        >
      </section>

      <section id="books">
        <div class="section-head">
          <h2>絵本一覧</h2>
          <p id="result-count"></p>
        </div>

        <div id="book-grid" class="book-grid"></div>
        <p id="empty-message" class="empty-message" hidden>
          条件に合う絵本が見つかりませんでした。
        </p>
      </section>

      <section id="about" class="about">
        <p class="eyebrow">ABOUT</p>
        <h2>このサイトについて</h2>
        <p>
          絵本の基本情報を集め、あとから検索や絞り込みができる形にするための学習用サイトです。
        </p>
      </section>
    </main>

    <footer>
      <span>Picture Book Guide</span>
    </footer>
  </div>

  <script src="books.js"></script>
  <script src="script.js"></script>
</body>
</html>
